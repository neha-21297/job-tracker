# .github/workflows/poll.yml
name: poll

on:
  schedule:
    - cron: "*/10 6-20 * * 1-5"      # every 10 min, weekday business hours UTC[cite: 1, 2]
    - cron: "0 */3 * * *"            # 3-hourly otherwise[cite: 1, 2]
  workflow_dispatch:                 # manual "check now" button[cite: 1, 2]
  repository_dispatch:               # external cron can fire this[cite: 1, 2]

concurrency:
  group: poll
  cancel-in-progress: false          # never let two runs race the git push[cite: 1, 2]

permissions:
  contents: write
  issues: write

jobs:
  poll:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Ensure data and docs directories exist
        run: mkdir -p data docs config

      - name: Run poll script
        run: python -m tracker.poll --tier 1,2
        env:
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          NOTIFY_EMAIL: ${{ secrets.NOTIFY_EMAIL }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Commit and push changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add -A data docs
          if ! git diff --staged --quiet; then
            git commit -m "poll: $(date -u +%FT%TZ)"
            REPO_URL="https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git"
            git pull --rebase "${REPO_URL}" "${{ github.ref_name }}"
            git push "${REPO_URL}" "HEAD:${{ github.ref_name }}"
          fi

      - name: Heartbeat
        if: success()
        run: curl -fsS -m 10 "${{ secrets.HEALTHCHECK_URL }}" || true
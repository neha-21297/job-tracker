# .github/workflows/poll.yml
name: poll

on:
  schedule:
    - cron: "*/10 6-20 * * 1-5"      # every 10 min, weekday business hours UTC
    - cron: "0 */3 * * *"            # 3-hourly otherwise
  workflow_dispatch:                 # manual "check now" button
  repository_dispatch:               # external cron can fire this

# Only one poll may modify main at a time. The commit/push step below also
# rebases onto the latest main and retries if another process pushes first.
concurrency:
  group: poll
  cancel-in-progress: false

permissions:
  contents: write
  issues: write

jobs:
  poll:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Ensure data and docs directories exist
        run: mkdir -p data docs config

      - name: Run poll script
        run: python -m tracker.poll --tier 1,2
        env:
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          NOTIFY_EMAIL: ${{ secrets.NOTIFY_EMAIL }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Commit and push generated data
        shell: bash
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add data docs

          # Nothing changed: there is no commit to make and nothing to push.
          if git diff --cached --quiet; then
            echo "No generated changes to commit."
            exit 0
          fi

          git commit -m "poll: automatic update"

          # The polling job can overlap with a manual push (or another actor
          # updating main). Never force-push. Instead, integrate the newest
          # remote main and retry the push if the remote moves between fetch
          # and push.
          for attempt in 1 2 3 4 5; do
            echo "Push attempt ${attempt}/5"
            git fetch origin main

            if ! git rebase origin/main; then
              echo "Rebase conflict while integrating origin/main."
              git rebase --abort || true
              exit 1
            fi

            if git push origin HEAD:main; then
              echo "Push succeeded."
              exit 0
            fi

            echo "Remote main moved during the push; retrying..."
            sleep $((attempt * 2))
          done

          echo "Unable to push after 5 attempts."
          exit 1

      - name: Heartbeat
        if: success()
        run: curl -fsS -m 10 "${{ secrets.HEALTHCHECK_URL }}" || true

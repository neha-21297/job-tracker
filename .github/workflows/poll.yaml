# .github/workflows/poll.yml
name: poll

on:
  schedule:
    - cron: "*/10 6-20 * * 1-5"      # every 10 min, weekday business hours UTC
    - cron: "0 */3 * * *"            # 3-hourly otherwise[cite: 1, 2]
  workflow_dispatch:                 # manual "check now" button[cite: 1, 2]
  repository_dispatch:               # external cron can fire this[cite: 1, 2]

concurrency:
  group: poll
  cancel-in-progress: false          # never let two runs race the git push[cite: 1, 2]

permissions:
  contents: write
  issues: write

jobs:
  poll:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Ensure data and docs directories exist
        run: mkdir -p data docs config[cite: 1, 2]

      - name: Run poll script
        run: python -m tracker.poll --tier 1,2
        env:
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          NOTIFY_EMAIL: ${{ secrets.NOTIFY_EMAIL }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Auto commit and push changes
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "poll: automatic update"
          file_pattern: "data/* docs/*"
          skip_dirty_check: false
          skip_fetch: false

      - name: Heartbeat
        if: success()
        run: curl -fsS -m 10 "${{ secrets.HEALTHCHECK_URL }}" || true[cite: 1, 2]
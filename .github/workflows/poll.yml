# .github/workflows/poll.yml
name: poll
on:
  schedule:
    - cron: "*/10 6-20 * * 1-5"      # Every 10 min during UK business hours
    - cron: "0 */3 * * *"            # Every 3 hours otherwise
  workflow_dispatch:                 # Manual trigger button

concurrency:
  group: poll
  cancel-in-progress: false[cite: 1]

permissions:
  contents: write[cite: 1]

jobs:
  poll:
    runs-on: ubuntu-latest
    timeout-minutes: 10[cite: 1]
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"[cite: 1]
          cache: pip[cite: 1]

      - run: pip install -r requirements.txt[cite: 1]

      - run: python -m tracker.poll[cite: 1]
        env:
          SMTP_HOST: "smtp.gmail.com"
          SMTP_PORT: "587"
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          NOTIFY_EMAIL: ${{ secrets.NOTIFY_EMAIL }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Commit if changed[cite: 1]
        run: |
          git config user.name "job-tracker"
          git config user.email "bot@users.noreply.github.com"
          git add data docs
          git diff --staged --quiet || git commit -m "poll: $(date -u +%FT%TZ)"
          git push
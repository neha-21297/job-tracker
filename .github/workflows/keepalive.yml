name: keepalive
on:
  schedule:
    - cron: "0 0 1 * *"
  workflow_dispatch:

jobs:
  keepalive:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.PAT }}
      - run: |
          date -u > .github/keepalive.txt
          git config user.name "keepalive-bot"
          git config user.email "bot@users.noreply.github.com"
          git add .github/keepalive.txt
          git commit -m "keepalive: keep scheduled cron active" || true
          git push
